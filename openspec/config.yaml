schema: spec-driven

context: |
  Magnetar is a Rust-first local AI Runtime with a v1.0.0 release baseline.
  The root workspace contains `magnetar-runtime`, `roadmap-contracts`,
  `tools/coverage-ratchet`, and `tools/release-publish`. A second workspace,
  `submodule-workspace`, contains `magnetar-cli`, `inference-components`, and
  production-loading, CUDA-first-native, and multi-device integration tests.
  External Components, Providers, Formats, and Loaders are pinned submodules.
  Reference CPU execution, Wasmtime Component execution, first-native Qwen
  inference, production Qwen artifact loading, and Ed25519 Component/Model
  Artifact verification are implemented. Hardware-specific support and
  production loading remain bounded by their documented supported profiles.
  Release automation includes real CLI builds, checksums, SBOM, provenance,
  release/security gate evidence, and Component/Kernel Bundle OCI distribution.
  A version declaration does not by itself prove remote publication succeeded.

  Canonical architecture:

      Component
          |
          | imports Capability
          v
      Runtime
          |
          | Resolution Policy plus Resource Affinity
          v
      Provider
          |
          v
      Device

  Canonical vocabulary:
  - Runtime: the local-node orchestration authority for Magnetar execution.
  - Component: portable WebAssembly Component Model code that uses WIT
    contracts.
  - Capability: a portable WIT contract that describes an ability available to
    Components.
  - Provider: a trusted native Runtime extension implementing one or more
    Capabilities.
  - Device: a Provider-owned physical or logical execution target.
  - Resource Affinity: authoritative metadata constraining where live resources
    may be used.
  - Resolution Policy: Runtime selection among compatible candidates after
    compatibility and affinity constraints.
  - Component Artifact: executable WASM Component code.
  - Model Artifact: weights and associated model data.

  Architectural invariants:
  - Components request Capabilities, not Providers or Devices.
  - Components SHALL NOT directly select CUDA, Metal, CPU, ROCm, OpenVINO, QNN,
    or another hardware implementation.
  - Components SHALL NOT receive native Runtime, Provider, or Device handles.
  - Components SHALL NOT receive raw pointers, queues, streams, backend storage,
    allocators, kernels, Rust trait objects, or process-local object references.
  - Component WIT contracts should be coarse-grained: graph, batch, model,
    session, or equivalent execution units.
  - Providers own native implementation details such as kernels, allocators,
    queues, streams, native contexts, driver APIs, and Device resources.
  - Providers implement Capabilities and expose Devices, but Runtime owns global
    Provider and Device resolution.
  - Resource Affinity constrains resolution whenever resources are bound to
    Provider, Device, Capability implementation, execution context, artifact,
    model, adapter, tokenizer, prompt template, cache, or another resource
    identity.
  - Resolution Policy cannot override authoritative Resource Affinity.
  - `Backend`, `Plugin`, and `Host` are not primary Magnetar architectural
    concepts. Use Provider, Component, Runtime, Device, or environment-specific
    language instead.
  - Archived OpenSpec history may retain historical terminology; current specs
    and canonical architecture docs take precedence.

  Magnetar/Tachyon boundary:
  - Magnetar owns local AI execution.
  - Tachyon owns distributed service orchestration, including cluster
    membership, routing, deployment, GitOps, and node selection.
  - Tachyon may distribute Magnetar-compatible Components and Model Artifacts.
  - Magnetar validates Components, controls Capability linking and authority,
    and performs local execution.
  - Magnetar SHALL NOT depend on Tachyon for standalone operation.
  - The permitted dependency direction is Tachyon -> Magnetar, not Magnetar ->
    Tachyon.

  Scope and maturity:
  - model loading/residency, tokenization, prompt formatting, generation,
    streaming, sessions, and KV lifecycle have implemented paths; do not
    describe them wholesale as future work or claim arbitrary-model support.
  - production batching, prefix-cache reuse, adapters, quantization,
    multi-device inference, model-hub downloads, and a production server/API
    transport remain limited or deferred as documented.
  - CLI client/agent functionality does not grant ambient filesystem, network,
    process, or tool authority to Runtime inference or portable Components.
  - distinguish implemented contracts and tested profiles from production
    guarantees; use current specs, code, and tests over archived plans.

rules:
  proposal:
    - State why new responsibilities belong in Magnetar.
    - For execution changes, identify the owning architectural layer.
    - For Component changes, identify imported and exported Capabilities.
    - For Provider changes, identify implemented Capabilities, exposed Devices,
      native responsibilities, compatibility expectations, and Resource
      Affinity behavior where applicable.
    - For stateful resources, define Resource Affinity and recovery semantics.
    - For external access, define authority and scope for resources such as
      filesystem, network, secrets, process execution, source control, and
      external services.
    - Identify compatibility impact on existing WIT contracts.
    - Include explicit non-goals for ambiguous cross-layer responsibilities.
  specs:
    - Use normative SHALL, SHOULD, and MAY language where applicable.
    - Include scenarios for architectural invariants.
    - Do not treat archived historical terminology as canonical.
    - Portable Component contracts must avoid native implementation types.
    - Do not define roadmap ideas as stable contracts before implementation.
  tasks:
    - Include implementation tasks.
    - Include test or validation tasks.
    - Include documentation tasks when public architecture changes.
    - Include WIT validation tasks when WIT changes.
    - Include cross-platform consideration for native Runtime changes.
    - Include migration tasks when an existing public contract changes.
