[package]
name = "magnetar-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hardware-agnostic execution runtime contracts for magnetar."
repository = "https://github.com/astorise/Magnetar"
readme = "../README.md"
keywords = ["ai", "inference", "runtime", "wasm", "webassembly"]
categories = ["science", "wasm"]
rust-version = "1.98"

[features]
default = ["wasmtime-component-engine"]
wasmtime-component-engine = ["dep:wasmtime"]
web-component-engine = []
# Correctif 7 / task group 10: without this feature, a build lacking a real
# Component engine (`wasmtime-component-engine` off, or the `wasm32` target,
# which has no Wasmtime engine at all) fails to compile rather than silently
# falling back to an unattested, Rust-synthesized graph -- first-native
# generation must fail closed without a Component, not fail open. Enable
# this only for genuinely non-strict uses (fixture-driven conformance
# checks, local experimentation without Wasmtime installed); it is not
# implied by any other feature, including `web-component-engine`.
non-strict-fixture-fallback = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sha2 = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "48.0.0", optional = true, default-features = false, features = ["anyhow", "runtime", "component-model", "component-model-async", "cranelift", "std", "wat"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
