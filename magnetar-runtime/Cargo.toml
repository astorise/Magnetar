[package]
name = "magnetar-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hardware-agnostic execution runtime contracts for magnetar."
repository = "https://github.com/astorise/Magnetar"
readme = "../README.md"
keywords = ["ai", "inference", "runtime", "wasm", "webassembly"]
categories = ["science", "wasm"]
rust-version = "1.98"

[features]
default = ["wasmtime-component-engine"]
wasmtime-component-engine = ["dep:wasmtime"]
web-component-engine = []
# Correctif 7 / task group 10, task 12.6: a build lacking a real Component
# engine (`wasmtime-component-engine` off, or the `wasm32` target, which has
# no Wasmtime engine at all) has no fallback graph source of any kind --
# first-native generation fails closed at runtime with a structured error,
# not by falling back to an unattested Rust-synthesized graph, and not by
# refusing to compile at all. There used to be a `non-strict-fixture-
# fallback` feature that opted a production build into the unattested
# fallback; it was removed deliberately, not merely unused -- production has
# exactly one graph-producing source (the real Component) now, with no
# second path to keep in sync or accidentally leave enabled. The
# Rust-synthesized graph builder (`qwen_model_component.rs`'s
# `qwen_build_graph`/`qwen_prefill_graph`/`qwen_decode_graph`) survives only
# under `#[cfg(test)]`, as a numerical-comparison oracle against the real
# Component and a fixture for this crate's own tests -- never reachable from
# a non-test build, with or without any feature.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"
sha2 = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "48.0.0", optional = true, default-features = false, features = ["anyhow", "runtime", "component-model", "component-model-async", "cranelift", "std", "wat"] }
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
