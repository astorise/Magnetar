# cargo-deny policy for Magnetar.
#
# Run locally with:
#   cargo deny check

[advisories]
# Fail on any security advisory or unmaintained/unsound notice affecting the
# dependency graph. Exceptions belong here, with a reason, never as a silenced
# CI step.
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0436 (`paste`, unmaintained): pulled in transitively via
    # `tokenizers` (`loaders/huggingface`'s real tokenizer.json backend --
    # see #59, which wired `cargo deny` into the crates that reach this
    # dependency for the first time and surfaced this). Not a vulnerability,
    # a proc-macro crate whose author archived it; the advisory itself
    # states "No safe upgrade is available" and this repository does not
    # control `tokenizers`' own dependency choice. Revisit when `tokenizers`
    # moves off it (or when the suggested `pastey` fork is viable).
    "RUSTSEC-2024-0436",
]

[bans]
# Several copies of one crate bloat build time and can mean two incompatible
# versions of a shared type are live at once.
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path dependencies (e.g. magnetar-cli -> magnetar-runtime)
# have no meaningful external version to pin -- the path itself is the pin --
# so they are exempt from the wildcard ban. Third-party deps still need one.
allow-wildcard-paths = true
skip = []

[licenses]
# Permissive licenses only: the crate itself ships under MIT, and a copyleft
# dependency would silently change what downstream consumers must comply with.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
