[package]
name = "magnetar-inference-component"
version = "0.1.0"
edition = "2024"
# #64: member of ../submodule-workspace -- see that manifest's own comment.
workspace = "../submodule-workspace"
license = "MIT"
publish = false

[features]
default = []
cuda = ["dep:magnetar-provider-cuda"]

[dependencies]
anyhow = "1"
magnetar-loader-gguf = { path = "../loaders/gguf" }
magnetar-loader-huggingface = { path = "../loaders/huggingface" }
magnetar-provider-cpu = { path = "../providers/cpu" }
magnetar-provider-cuda = { path = "../providers/cuda", optional = true }
magnetar-runtime = { path = "../magnetar-runtime", features = ["wasmtime-component-engine"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
# Test-only: signs fixture manifests with a local test keypair to drive
# `ArtifactTrustPolicy::trust_component_publisher_key`'s real Ed25519
# verification path (TACH-11). Never used outside `#[cfg(test)]` --
# production signature verification stays entirely inside
# `magnetar-runtime`.
ed25519-dalek = { version = "3.0.0", features = ["signature"] }
