name: Benchmark CPU

on:
  workflow_dispatch:
    inputs:
      tokens:
        description: Maximum generated tokens per request (at least 2)
        default: '16'
        required: true
      runs:
        description: Number of measured requests per engine
        default: '5'
        required: true

permissions:
  contents: read

concurrency:
  group: benchmark-cpu
  cancel-in-progress: false

jobs:
  benchmark:
    name: CPU / same-machine comparison
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCH_DEVICE: cpu
      BENCH_TOKENS: ${{ inputs.tokens }}
      BENCH_RUNS: ${{ inputs.runs }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev python3-venv zstd
      - name: Select Python 3.12 for PyTorch
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Initialize Magnetar dependencies
        run: git submodule update --init -- providers/cuda providers/cpu loaders/huggingface formats/safetensors loaders/gguf formats/gguf components/laya components/modernbert components/nemotron components/olala
      - name: Record CPU and run all engines sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          lscpu | tee "$RUNNER_TEMP/benchmark-results/cpu-info.txt"
          bash benchmark/campaign.sh
      - name: Magnetar on one thread per physical core (thread-count check)
        # The campaign runs the optimized CPU Provider on every logical CPU
        # (its default); this reruns it, already built, on one thread per
        # physical core of the same host, so the default stays measured.
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/benchmark-results/magnetar-physical-cores"
          mkdir -p "$out"
          cores="$(lscpu -p=CORE,SOCKET | grep -v '^#' | sort -u | wc -l)"
          MAGNETAR_CPU_THREADS="$cores" \
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$RUNNER_TEMP/benchmark-work/qwen2.5-0.5b-instruct" \
          MAGNETAR_QUALIFICATION_PROVIDERS=cpu-native \
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS="$BENCH_TOKENS" \
          MAGNETAR_QUALIFICATION_MEASURED_RUNS="$BENCH_RUNS" \
          MAGNETAR_QUALIFICATION_REPORT_DIR="$out" \
            cargo test --release --manifest-path integration-tests/production-loading/Cargo.toml \
              real_checkpoint_qualification_campaign -- --include-ignored --nocapture > "$out/log.txt" 2>&1
          summary="$(grep -E '^\[cpu-native\] [0-9]+ prompt tokens: load' "$out/log.txt")"
          echo "Magnetar on $cores threads (one per physical core): $summary" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Magnetar decoding on one thread per physical core (thread-count check)
        # Prefill on every logical CPU, decode steps (one-row Kernels) on a
        # pool of one thread per physical core (MAGNETAR_CPU_DECODE_THREADS):
        # a core's second hardware thread helps the compute-bound prefill
        # and can slow the memory-bound decode step.
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/benchmark-results/magnetar-decode-physical-cores"
          mkdir -p "$out"
          cores="$(lscpu -p=CORE,SOCKET | grep -v '^#' | sort -u | wc -l)"
          MAGNETAR_CPU_DECODE_THREADS="$cores" \
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$RUNNER_TEMP/benchmark-work/qwen2.5-0.5b-instruct" \
          MAGNETAR_QUALIFICATION_PROVIDERS=cpu-native \
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS="$BENCH_TOKENS" \
          MAGNETAR_QUALIFICATION_MEASURED_RUNS="$BENCH_RUNS" \
          MAGNETAR_QUALIFICATION_REPORT_DIR="$out" \
            cargo test --release --manifest-path integration-tests/production-loading/Cargo.toml \
              real_checkpoint_qualification_campaign -- --include-ignored --nocapture > "$out/log.txt" 2>&1
          summary="$(grep -E '^\[cpu-native\] [0-9]+ prompt tokens: load' "$out/log.txt")"
          echo "Magnetar decoding on $cores threads (one per physical core), prefill on every logical CPU: $summary" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: CPU kernel bandwidth (diagnostic)
        # Streams each decode matmul shape of a Qwen2.5-0.5B layer from
        # memory, in both stored layouts, with the default kernels and with
        # AVX2 only, and in llama.cpp's row-at-a-time pattern, so kernel
        # choices are checked on each runner's CPU.
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/benchmark-results/cpu-kernels.txt"
          for simd in default avx2; do
            echo "== kernels: $simd" | tee -a "$out"
            if [[ "$simd" == avx2 ]]; then export MAGNETAR_CPU_SIMD=avx2; else unset MAGNETAR_CPU_SIMD; fi
            cargo test --release --manifest-path providers/cpu/Cargo.toml --lib -- \
              --ignored --nocapture --test-threads=1 streamed_matmul_costs 2>&1 \
              | grep -E 'pool run|streamed' | tee -a "$out"
          done
          { echo '```'; cat "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
