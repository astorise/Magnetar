name: Benchmark CPU

on:
  push:
    branches: [codex/benchmark-comparison-20261119-0749]
  workflow_dispatch:
    inputs:
      tokens:
        description: Maximum generated tokens per request (at least 2)
        default: '16'
        required: true
      runs:
        description: Number of measured requests per engine
        default: '5'
        required: true

permissions:
  contents: read

concurrency:
  group: benchmark-cpu
  cancel-in-progress: false

jobs:
  benchmark:
    name: CPU / same-machine comparison
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BENCH_DEVICE: cpu
      BENCH_TOKENS: ${{ inputs.tokens || '16' }}
      BENCH_RUNS: ${{ inputs.runs || '5' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install benchmark dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev python3-venv zstd
      - name: Select Python 3.12 for PyTorch
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Initialize Magnetar dependencies
        run: git submodule update --init -- providers/cuda providers/cpu loaders/huggingface formats/safetensors loaders/gguf formats/gguf
      - name: Record CPU and run all engines sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          lscpu | tee "$RUNNER_TEMP/benchmark-results/cpu-info.txt"
          bash benchmark/campaign.sh
      - name: Upload benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
