name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    name: quality / rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rust-toolchain.toml pins the toolchain and its components, so rustup
      # installs exactly that on first use. Installing a different version here
      # would download a toolchain that the toolchain file then overrides.
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Validate formatting
        run: cargo fmt --all -- --check

  check:
    name: quality / check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

  clippy:
    name: quality / clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: quality / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run tests
        run: cargo test --locked --workspace --all-targets

  msrv:
    name: quality / msrv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The declared rust-version floor is only a real claim if something
      # builds against it, so this job deliberately overrides the pinned
      # toolchain instead of using rust-toolchain.toml.
      - name: Resolve declared MSRV
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' magnetar-runtime/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Install MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check workspace against the declared MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-features

  deny:
    name: quality / cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@6a0cb247e1ded000e6ae26346b5ab63b08c98e6a # cargo-deny
      - name: Check advisories, bans, licenses and sources
        run: cargo deny --all-features check

  wasmtime-component-engine:
    name: quality / wasmtime component engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test Wasmtime Component Engine
        run: cargo test --locked -p magnetar-runtime --all-targets --features wasmtime-component-engine

  wasm32-component-engine:
    name: quality / wasm32 component engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check wasm32 Component Runtime
        run: cargo check --locked -p magnetar-runtime --target wasm32-unknown-unknown --all-features

  provider-conformance:
    name: quality / provider conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run hardware-independent Provider conformance
        run: cargo test --locked -p magnetar-runtime provider_conformance -- --nocapture

  e2e-conformance:
    name: quality / e2e conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run First-Native Runtime Conformance (no GPU required)
        run: cargo test --locked -p magnetar-runtime first_native_runtime -- --nocapture

  docs:
    name: quality / docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build workspace documentation
        run: cargo doc --locked --workspace --no-deps
      - name: Build Wasmtime Component Engine documentation
        run: cargo doc --locked -p magnetar-runtime --no-deps --features wasmtime-component-engine

  wit:
    name: quality / wit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install wasm-tools
        uses: taiki-e/install-action@0d69a653e6ce95636a5a6c2bc6938a6cb3e2e0c5 # wasm-tools
      - name: Validate WIT packages
        shell: bash
        run: |
          set -euo pipefail
          find . -path '*/wit/*.wit' -print0 | while IFS= read -r -d '' wit; do
            wasm-tools component wit "$wit" >/dev/null
          done
          find . -path '*/fixtures/components/*.component.wat' -print0 | while IFS= read -r -d '' wat; do
            wasm-tools parse "$wat" -o /tmp/component-fixture.wasm
            wasm-tools validate /tmp/component-fixture.wasm --features component-model
          done

  openspec:
    name: quality / openspec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.2.0
      - name: Validate OpenSpec artifacts
        run: openspec validate --all --strict

  # Model-family isolation (task group 12 / Correctif 9, task 12.7; extended
  # to close GitHub issue "Finish model-family isolation beyond the current
  # CI allowlist"): the Provider/Kernel/Device/Memory/Tensor/Component
  # contract files listed below are the generic Core magnetar-runtime itself
  # depends on for every model family, not just Qwen -- they must never
  # encode Qwen- or Llama-specific knowledge (a weight-name suffix table, a
  # hardcoded KV namespace, an enum variant naming one model family by
  # name). A full sweep of every file in `magnetar-runtime/src/` (not just
  # this list) for the same pattern found exactly one genuine violation
  # outside it -- `conformance.rs`'s `QwenWasmModelComponent` enum variant,
  # a "generic first-native capability" enum with one entry naming a
  # specific Model Component implementation, now renamed to
  # `ModelWasmComponent` -- plus one test-fixture string in
  # `kernel_execution_plan.rs` (`ModelInstanceId::new("qwen-decode")`,
  # renamed to `"model-decode"`; the value was never live logic, just an
  # arbitrary test id). Both files are now clean and added below.
  #
  # Deliberately still excluded, by classification rather than oversight:
  # `first_native_runtime.rs` and `qwen_model_component.rs` are the two
  # files designated to legitimately carry Qwen-specific knowledge (see
  # their own doc comments) -- but `first_native_runtime.rs` also hosts the
  # *generic* production facade (`ProductionLoadedModel`,
  # `production_model_fixture`, `build_first_native_graphs_from_named_
  # component`), which this file-level exclusion left with zero coverage
  # (Tachyon integration audit MAG-05, #80). The second step below covers
  # exactly that facade's own bodies instead of the whole file.
  # `first_native_implementation_cut.rs` and
  # `e2e_conformance.rs` are explicitly scoped to the first-native
  # (currently Qwen) cut and to test/conformance fixtures respectively, not
  # generic Core. The roadmap/release-process files this guard used to name
  # here (`model_format_roadmap.rs`, `model_source_cache_roadmap.rs`,
  # `provider_roadmap.rs`, `release_cutover.rs`, `release_packaging.rs`,
  # `release_security.rs`) no longer live in `magnetar-runtime/src/` at all
  # -- they moved to the `roadmap-contracts/` crate (#62), whose explicit
  # purpose is to name specific model families (planned format/provider
  # support, the current release's own Qwen-baseline scope); naming a
  # family there is the point, not a leak, so this guard does not apply to
  # them, and now can't even see them. `tests.rs` and other
  # `#[cfg(test)]`-only modules are exempt for
  # the same reason as the "explicitly isolated tests/oracles" carve-out in
  # the tracking issue: a fixture identifier string is not live Core logic.
  model-family-isolation:
    name: quality / model-family isolation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject model-family identifiers in generic Core modules
        shell: bash
        run: |
          set -euo pipefail
          pattern='(qwen|llama|self_attn\.[a-z]+_proj|mlp\.(gate|up|down)_proj)'
          modules=(
            magnetar-runtime/src/affinity.rs
            magnetar-runtime/src/capability.rs
            magnetar-runtime/src/component.rs
            magnetar-runtime/src/component_wasmtime.rs
            magnetar-runtime/src/compute.rs
            magnetar-runtime/src/conformance.rs
            magnetar-runtime/src/device.rs
            magnetar-runtime/src/execution_graph.rs
            magnetar-runtime/src/graph_builder_capability.rs
            magnetar-runtime/src/kernel.rs
            magnetar-runtime/src/kernel_compilation.rs
            magnetar-runtime/src/kernel_execution_plan.rs
            magnetar-runtime/src/memory.rs
            magnetar-runtime/src/operator.rs
            magnetar-runtime/src/provider.rs
            magnetar-runtime/src/reference_cpu.rs
            magnetar-runtime/src/scheduler.rs
            magnetar-runtime/src/tensor.rs
          )
          fail=0
          for module in "${modules[@]}"; do
            # Strip line comments first, so prose explaining genericness
            # (e.g. "nothing here names Qwen or Llama") cannot itself trip
            # the guard -- only live code is checked.
            if sed -E 's#//.*$##' "$module" | grep -nEi "$pattern"; then
              echo "::error file=$module::model-family identifier found in a designated generic Core module"
              fail=1
            fi
          done
          exit "$fail"
      # Tachyon integration audit MAG-05 (#80): the guard above deliberately
      # excludes first_native_runtime.rs and qwen_model_component.rs (they
      # legitimately carry Qwen-specific knowledge), which also means it has
      # zero visibility into the *generic* production facade that happens to
      # live inside first_native_runtime.rs -- ProductionLoadedModel,
      # production_model_fixture, build_first_native_graphs_from_named_component
      # -- and inference-components' own LoadedInferenceComponent::load. This
      # step scans exactly those specific bodies (not the whole file) against
      # an explicit, individually justified allowlist tracked by #82 -- see
      # tools/check_generic_facade_family_isolation.py's own doc comment.
      - name: Reject model-family identifiers in the generic production facade
        run: python3 tools/check_generic_facade_family_isolation.py .

  # #54/#63: the whole point of moving unit tests out of magnetar-runtime's
  # production files and into per-module `tests.rs` siblings was to stop
  # coverage tooling (and human readers) from having to see test code mixed
  # into production source -- a blocking gate is what actually keeps that
  # property, since a warning-only check would let exactly the same
  # inline-test debt this effort just removed grow back one PR at a time.
  # Scoped to magnetar-runtime/src and roadmap-contracts/src (#62's
  # extraction target), both of which this effort already brought to zero
  # violations -- deliberately NOT magnetar-cli/src, which has its own
  # separate, established inline `mod tests { ... }` convention that was
  # never part of this effort and this guard has no mandate to break.
  #
  # Two independent rules, each precise enough to avoid flagging the
  # legitimate `#[cfg(test)]` uses #54/#63's own inventory found and chose
  # to keep (see the tracking issue): cfg-gated build-variant dispatch
  # (multiple `fn` bodies for the same signature, selected by target/feature
  # config) and cfg-gated statements inside an otherwise-production function
  # that call into a `tests` submodule. Neither rule below touches those --
  # only an actual `#[test]` function body, or an inline `mod tests { ... }`
  # block, living directly in a file that is not itself a dedicated test
  # file:
  #   1. `#[test]` found in a file whose name is not `tests.rs` /
  #      `*_tests.rs` / `*-tests.rs`.
  #   2. `mod tests { ... }` (a body) rather than the canonical
  #      `#[cfg(test)] mod tests;` pointer to a sibling file.
  test-code-placement:
    name: quality / test code placement
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject inline test implementations outside dedicated tests.rs files
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            case "$base" in
              tests.rs|*_tests.rs|*-tests.rs) continue ;;
            esac
            if grep -nE '^\s*#\[test\]' "$file" >/dev/null; then
              echo "::error file=$file::#[test] function found outside a dedicated tests.rs file -- move it to this module's sibling tests.rs (see #54/#63)"
              fail=1
            fi
            if grep -nE '^\s*mod\s+tests\s*\{' "$file" >/dev/null; then
              echo "::error file=$file::inline 'mod tests { ... }' found -- move its body to a sibling tests.rs and declare 'mod tests;' here instead (see #54/#63)"
              fail=1
            fi
          done < <(find magnetar-runtime/src roadmap-contracts/src -name '*.rs' -print0)
          exit "$fail"

  # Component integration (task 15.6): Component submodules only, sparse
  # checkout. Split out from the single consolidated `submodule-integration`
  # job below now that `components/qwen` is real (task group 11);
  # `components/llama` remains a template and simply passes trivially until
  # it has real content of its own.
  component-integration:
    name: quality / component integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout Component submodules
        run: git submodule update --init -- components/qwen components/llama
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build and test each Component crate independently
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            components/qwen/Cargo.toml \
            components/llama/Cargo.toml
          do
            echo "::group::$manifest"
            cargo test --locked --manifest-path "$manifest"
            echo "::endgroup::"
          done

  # Format integration (task 15.7): Format submodules only, sparse checkout.
  # `cargo test` already runs each crate's malformed-input corpus regression
  # suite (task 16.3); real `cargo-fuzz` execution stays a local/periodic
  # activity, not a per-PR CI step, per `implement-model-format-parsers`'s
  # own documented reasoning (nightly-toolchain requirement, and no
  # sanitizer-runtime-equipped runner configured here).
  format-integration:
    name: quality / format integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout Format submodules
        run: git submodule update --init -- formats/gguf formats/safetensors
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build and test each Format crate independently
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            formats/gguf/Cargo.toml \
            formats/safetensors/Cargo.toml
          do
            echo "::group::$manifest"
            cargo test --locked --manifest-path "$manifest"
            echo "::endgroup::"
          done

  # Provider integration (task 15.8): Provider submodules only, sparse
  # checkout. `providers/cpu` is real (task group 14) and mandatory here --
  # a failure fails this job. `providers/cuda` is real too now
  # (`implement-cuda-provider-baseline`), but this runner has no CUDA
  # toolchain or GPU: `CudaProvider` is designed to construct successfully
  # and report itself gracefully unavailable in that case (`cudarc`'s
  # dynamic-loading feature has no build-time CUDA dependency at all), so
  # this job exercises exactly that "no hardware" branch, not a hardware
  # gate. It is genuinely optional/hardware-gated the way 15.8 intended: the
  # real GPU-required kernel/conformance path runs separately on the
  # self-hosted `arc-gpu-magnetar` runner (`gpu-runner-smoke.yml`), not
  # here.
  provider-integration:
    name: quality / provider integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout Provider submodules
        run: git submodule update --init -- providers/cpu providers/cuda providers/rocm providers/metal providers/wgpu providers/npu providers/tpu
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build and test the mandatory CPU Provider
        run: cargo test --locked --manifest-path providers/cpu/Cargo.toml
      - name: "Build and test the CUDA Provider (GPU-less here: exercises its graceful-unavailability path)"
        run: cargo test --locked --manifest-path providers/cuda/Cargo.toml
      - name: "Build and test the ROCm Provider (GPU-less here: exercises its graceful-unavailability path)"
        run: cargo test --locked --manifest-path providers/rocm/Cargo.toml
      - name: "Build and test the Metal Provider (unconditionally unavailable on every non-macOS platform)"
        run: cargo test --locked --manifest-path providers/metal/Cargo.toml
      - name: "Build and test the NPU Provider (no Level Zero NPU driver here: exercises its graceful-unavailability path)"
        run: cargo test --locked --manifest-path providers/npu/Cargo.toml
      - name: "Build and test the TPU Provider (no Coral Edge TPU attached here: exercises its graceful-unavailability path)"
        run: cargo test --locked --manifest-path providers/tpu/Cargo.toml
      # `mesa-vulkan-drivers` provides `llvmpipe`, a real (CPU-backed)
      # software Vulkan ICD -- lets this genuinely GPU-less runner still
      # exercise the WGPU Provider's real device-discovery and real
      # compute-kernel dispatch path, not only its graceful-
      # unavailability fallback (`providers/wgpu`'s own tests gracefully
      # skip, rather than fail, if this does not yield a usable adapter).
      - name: Install a software Vulkan driver (llvmpipe) for the WGPU Provider
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Build and test the WGPU Provider
        run: cargo test --locked --manifest-path providers/wgpu/Cargo.toml
      - name: Install cargo-deny
        uses: taiki-e/install-action@6a0cb247e1ded000e6ae26346b5ab63b08c98e6a # cargo-deny
      # The root `deny` job above never sees this submodule (it checks out
      # without submodules by design, `externalize-runtime-extension-
      # modules`'s "zero compile-time dependency on any externalized
      # module"), so `cudarc` -- the CUDA Provider's one new, critical,
      # native-library-adjacent dependency -- never entered any `cargo deny`
      # graph until this step (`docs/audits/cuda-provider-full-audit-2026-09-05.md`'s
      # P2 finding; `providers/cuda/deny.toml` carries the rationale).
      # `providers/rocm`'s `libloading` and `providers/wgpu`'s `wgpu`/
      # `pollster` are the identical class of new, dynamic-library-adjacent
      # dependency, each with their own `deny.toml` for the same reason.
      # `providers/npu` and `providers/tpu` both use the same `libloading`
      # dependency as `providers/rocm`.
      - name: Check the CUDA Provider's own dependency graph (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path providers/cuda/Cargo.toml check
      - name: Check the ROCm Provider's own dependency graph (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path providers/rocm/Cargo.toml check
      - name: Check the WGPU Provider's own dependency graph (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path providers/wgpu/Cargo.toml check
      - name: Check the NPU Provider's own dependency graph (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path providers/npu/Cargo.toml check
      - name: Check the TPU Provider's own dependency graph (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path providers/tpu/Cargo.toml check

  # Full conformance (task 15.9): the original, unsplit job -- checks out
  # every submodule via `submodules: recursive` and re-runs the same
  # build/test loop across all six, as a single comprehensive gate
  # alongside (not instead of) the three narrower tier jobs above. Some
  # redundancy with those jobs is intentional: a tier job gives fast,
  # scoped feedback when only one area changes, while this job proves the
  # full submodule set still integrates together.
  submodule-integration:
    name: quality / submodule integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build and test each submodule crate independently
        shell: bash
        run: |
          set -euo pipefail
          for manifest in \
            components/qwen/Cargo.toml \
            components/llama/Cargo.toml \
            formats/gguf/Cargo.toml \
            formats/safetensors/Cargo.toml \
            providers/cpu/Cargo.toml \
            providers/cuda/Cargo.toml \
            providers/rocm/Cargo.toml \
            providers/metal/Cargo.toml \
            providers/wgpu/Cargo.toml \
            providers/npu/Cargo.toml \
            providers/tpu/Cargo.toml \
            loaders/huggingface/Cargo.toml \
            loaders/gguf/Cargo.toml
          do
            echo "::group::$manifest"
            cargo test --locked --manifest-path "$manifest"
            echo "::endgroup::"
          done
      # `magnetar-cli`, `inference-components`, and the three
      # `integration-tests/*` crates are first-party code this repository
      # owns directly (not externalized modules), but each depends on a
      # submodule absent from a plain root-level build (`loaders/
      # huggingface`, `loaders/gguf`, `providers/cpu`, `providers/cuda`) --
      # `implement-production-qwen-model-loading` task 10.4 moved
      # `magnetar-cli` out of the repository root's `[workspace]` for
      # exactly this reason, and the other four followed the same pattern
      # independently over time (#64: five separate `[workspace]` tables,
      # five separate `Cargo.lock`s, three of the five never even covered
      # by a `cargo fmt`/`clippy` step -- `integration-tests/cuda-first-
      # native` was in no workflow at all before #58,
      # `inference-components` was built and tested nowhere before this
      # job first added it). All five now share one `[workspace]` in
      # `submodule-workspace/Cargo.toml` (each declares
      # `package.workspace = "../submodule-workspace"` or
      # `"../../submodule-workspace"` instead of its own `[workspace]`
      # table), so this is the one job that checks them out recursively
      # and the one place that now builds, tests, formats, and lints all
      # five together, in the same `--workspace` shape the root-level jobs
      # above use for `magnetar-runtime`.
      - name: Format-check the submodule workspace
        shell: bash
        run: cargo fmt --manifest-path submodule-workspace/Cargo.toml --all -- --check
      - name: Check and test the submodule workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --manifest-path submodule-workspace/Cargo.toml --workspace --all-targets --all-features
          cargo test --locked --manifest-path submodule-workspace/Cargo.toml --workspace --all-targets --all-features
      - name: Clippy the submodule workspace
        shell: bash
        run: cargo clippy --locked --manifest-path submodule-workspace/Cargo.toml --workspace --all-targets --all-features -- -D warnings
      - name: Build submodule workspace documentation
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --manifest-path submodule-workspace/Cargo.toml --workspace --no-deps
      # `implement-production-qwen-model-loading` task 12.8: production
      # loading/generation SHALL NOT call `fixture_model_manifest`, a
      # fixture tensor inventory builder, or require the literal
      # `qwen-test` model reference. `loaders/huggingface` (the real
      # production ingestor) never depends on anything carrying fixture
      # logic in the first place, so its source containing neither string
      # anywhere is a direct, robust proof; `magnetar-cli`'s local-file
      # loading command (the one caller this change moved off the fixture
      # manifest path, task 10.4) is checked the same way, isolated to
      # just that command's own function body so this does not also flag
      # `cmd_model_load`'s deliberately-still-fixture-backed `<model-ref>`
      # path (task 10.3: `qwen-test` stays fixture/demo/conformance only).
      - name: Source guard -- production loading never uses the fixture manifest path
        shell: bash
        run: |
          set -euo pipefail
          if grep -rlE 'fixture_model_manifest|"qwen-test"' loaders/huggingface/src/ loaders/gguf/src/; then
            echo "::error::a production ingestor (loaders/huggingface, loaders/gguf) must never reference fixture_model_manifest or the literal qwen-test model reference"
            exit 1
          fi
          local_file_fn="$(awk '/^fn cmd_model_load_local_file/,/^}/' magnetar-cli/src/commands.rs)"
          if grep -qE 'fixture_model_manifest|"qwen-test"' <<< "$local_file_fn"; then
            echo "::error file=magnetar-cli/src/commands.rs::cmd_model_load_local_file must not call fixture_model_manifest or require the literal qwen-test model reference"
            exit 1
          fi
      # Task 11.4: the production-loading integration test and sample
      # embedder contain no Safetensors tensor parser, Qwen graph builder,
      # dtype conversion loop, or TensorResourceId fabrication of their
      # own -- an embedder consumes only the public ingestion/loading/
      # generation surface, never reimplements or reaches into Runtime-
      # internal primitives.
      - name: Source guard -- the Tachyon-shaped integration test uses only public APIs
        shell: bash
        run: |
          set -euo pipefail
          pattern='TensorResourceId|SafetensorsTensorEntry|qwen_build_graph|dispatch_matmul|dispatch_reference_cpu_operator|convert_f16_to_f32|convert_bf16_to_f32'
          if grep -rlE "$pattern" integration-tests/production-loading/src/; then
            echo "::error::integration-tests/production-loading must drive production loading through public APIs only, never Runtime-internal parsing/graph-building/dtype-conversion/resource-id primitives"
            exit 1
          fi
      # `externalize-runtime-extension-modules`'s "Model Components,
      # Providers, and Formats Are Externalized" requirement: the Core
      # (magnetar-runtime) SHALL have zero compile-time dependency on any
      # externalized Component/Provider/Format crate. Originally added
      # narrower (`implement-model-format-parsers` task 5.1/5.2, covering
      # only the two format crates, itself replacing reach-architecture-
      # freeze-1 task 16.4's "trivially true, unverified by tooling" state);
      # generalized here to every module following the established
      # `magnetar-component-*`/`magnetar-format-*`/`magnetar-provider-*`
      # naming convention (verified against all six submodules' own
      # Cargo.toml `name` fields), so a new module added under that
      # convention is covered automatically rather than needing this
      # guard's pattern hand-updated every time. Extended with `loader` by
      # `implement-production-qwen-model-loading` task 1.4 to also cover
      # `magnetar-loader-*` (the production Model Artifact ingestor
      # externalization boundary `production-model-ingestion` defines --
      # `magnetar-runtime` SHALL have zero compile-time dependency on
      # `loaders/huggingface` or any future concrete ingestor crate).
      - name: Verify magnetar-runtime has no externalized-module dependency
        shell: bash
        run: |
          set -euo pipefail
          pattern='magnetar-(component|format|provider|loader)-'
          if grep -qE "$pattern" magnetar-runtime/Cargo.toml; then
            echo "::error file=magnetar-runtime/Cargo.toml::magnetar-runtime must not depend on an externalized Component/Provider/Format crate"
            exit 1
          fi
          tree_output="$(cargo tree --manifest-path magnetar-runtime/Cargo.toml --all-features)"
          if grep -qE "$pattern" <<< "$tree_output"; then
            echo "::error file=magnetar-runtime/Cargo.toml::magnetar-runtime's resolved dependency graph includes an externalized Component/Provider/Format crate"
            exit 1
          fi
      # #59: the root `deny` job above checks out without submodules by
      # design (`externalize-runtime-extension-modules`'s "zero
      # compile-time dependency on any externalized module"), so it never
      # sees `magnetar-cli`'s ~200-crate dependency graph (through
      # `loaders/huggingface` -> `tokenizers`) or any of the crates below --
      # the same gap `provider-integration`'s own `cargo deny` steps closed
      # for the Provider submodules. This job already checks out every
      # submodule recursively, so it is the natural place to close the
      # rest.
      - name: Install cargo-deny
        uses: taiki-e/install-action@6a0cb247e1ded000e6ae26346b5ab63b08c98e6a # cargo-deny
      - name: Check the submodule workspace's dependency graph (advisories, bans, licenses, sources)
        # `--allow wildcard --allow unlicensed`: `magnetar-format-safetensors`
        # and `magnetar-loader-huggingface` (external submodules this
        # repository does not own) declare neither `license` nor
        # `publish = false` in their own Cargo.toml, which trips
        # cargo-deny's `unlicensed` check and its `wildcard` check
        # (`allow-wildcard-paths` only exempts a crate cargo-deny can see
        # is unpublishable). Not fixable from this repository; scoped to
        # exactly these two lint classes so a real license/bans/advisories/
        # sources regression elsewhere in this graph still fails the
        # build. `--manifest-path submodule-workspace/Cargo.toml` checks
        # all five of `magnetar-cli`/`inference-components`/the three
        # `integration-tests/*` crates in one resolved graph (#64) --
        # cargo-deny's own default scope for a workspace manifest is every
        # member, so this replaces what used to be five separate steps.
        run: cargo deny --manifest-path submodule-workspace/Cargo.toml check --allow wildcard --allow unlicensed
      - name: Check loaders/huggingface's own dependency graph (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path loaders/huggingface/Cargo.toml check --allow wildcard --allow unlicensed
      - name: Check loaders/gguf's own dependency graph (advisories, bans, licenses, sources)
        run: cargo deny --manifest-path loaders/gguf/Cargo.toml check --allow wildcard --allow unlicensed

  # #54's own separate request: a re-baseline should record *why* in a
  # structured field, not only as prose appended to `notes` (which had grown
  # to a single ~4 KB ever-growing string). tools/check_coverage_baseline_history.py
  # enforces that going forward: if a PR changes quality/coverage-baseline.json's
  # recorded line_coverage_percent/function_coverage_percent, its
  # rebaseline_history array must have gained a new entry whose own
  # `recorded` figures match and which carries a non-empty `reason`. Only
  # runs on pull_request (needs the PR's base commit to diff against); a
  # direct push to main skips it.
  coverage-baseline-history:
    name: quality / coverage baseline history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require a structured rebaseline_history entry when the recorded percentages change
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" -- quality/coverage-baseline.json; then
            echo "quality/coverage-baseline.json unchanged in this PR"
            exit 0
          fi
          git show "$BASE_SHA:quality/coverage-baseline.json" > /tmp/base-coverage-baseline.json
          python3 tools/check_coverage_baseline_history.py \
            quality/coverage-baseline.json /tmp/base-coverage-baseline.json

  coverage:
    name: quality / coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab4220e067fa624f7930084426dbfb7440a52829 # cargo-llvm-cov
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Prepare coverage output
        run: mkdir -p target/llvm-cov
      - name: Generate coverage
        # `--exclude-from-report magnetar-roadmap-contracts`: that crate
        # still builds and its own tests still run here (part of
        # `--workspace`), but its ~17,500 lines of executable roadmap/
        # release-process contracts (#62) are near-100%-covered by
        # construction (they're conformance tests for their own module) and
        # would otherwise reinflate this ratchet the same way #54 found
        # them doing when they lived inside magnetar-runtime itself --
        # `roadmap_contracts` (crate name, not package name) since
        # `--exclude-from-report`/`--exclude` match the library/binary
        # name cargo-llvm-cov resolves per-crate, not the `[package] name`.
        run: >
          cargo llvm-cov --locked --workspace --all-targets --all-features
          --exclude-from-report magnetar-roadmap-contracts
          --ignore-filename-regex '(^|/)(target|tests?)/'
          --json --summary-only --output-path target/llvm-cov/coverage.json
      - name: Generate LCOV artifact
        run: >
          cargo llvm-cov report
          --ignore-filename-regex '(^|/)(target|tests?)/'
          --lcov --output-path target/llvm-cov/lcov.info
      - name: Check coverage ratchet
        run: cargo run --manifest-path tools/coverage-ratchet/Cargo.toml -- target/llvm-cov/coverage.json quality/coverage-baseline.json
      - name: Publish coverage summary
        if: always()
        run: cargo run --manifest-path tools/coverage-ratchet/Cargo.toml -- --summary target/llvm-cov/coverage.json quality/coverage-baseline.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: target/llvm-cov/
          if-no-files-found: warn
