name: GPU Runner Smoke Test

# Confirms the arc-gpu-magnetar self-hosted GPU runner is reachable and can
# build/test providers/cuda's real CUDA Provider: device discovery, the
# `operator-scope` required-now kernel set (NVRTC-compiled), the
# device-resident allocation table and explicit host/device data movement
# (`enable-device-resident-kernel-chaining`), and the `provider-core`/
# `provider-compute`/`provider-data-movement` conformance profiles against
# real hardware. Not gated per-PR because it needs a live GPU runner, not
# because there is nothing CUDA-specific to test -- per-PR CI
# (`quality.yml`'s `provider-integration`) only ever runs `providers/cuda`
# on a GPU-less runner, exercising its graceful-unavailability branch, not
# this real-hardware path (#61: this workflow used to be `workflow_dispatch`
# only, so nothing verified the CUDA path on `main` unless a human
# remembered to press a button -- there was no record of when it last
# passed). The daily schedule below is the automatic floor; `workflow_dispatch`
# stays for an on-demand run. `concurrency.cancel-in-progress: false` below
# already serializes every trigger of this workflow onto the one self-hosted
# runner, so the schedule cannot pile up runs alongside a manual dispatch.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: gpu-runner-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: gpu / smoke test
    runs-on: arc-gpu-magnetar
    container:
      image: nvidia/cuda:13.5.0-cudnn-devel-ubuntu24.04
      options: --gpus all
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git curl build-essential ca-certificates
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout CUDA Provider submodule
        # The container's git refuses to touch a workspace it doesn't own --
        # the checkout step ran before git existed in this image, so the
        # workspace's ownership doesn't match this step's user. Also checks
        # out providers/cpu: providers/cuda's [dev-dependencies] path-depends
        # on it (conformance tests compare CUDA kernel output against
        # Reference CPU's), so cargo cannot even load the manifest without it
        # -- a real gap this workflow had (confirmed by dispatching it: it
        # failed with "failed to read providers/cpu/Cargo.toml" before this
        # fix), not something introduced by CUDA-specific test content.
        # loaders/huggingface, formats/safetensors, loaders/gguf, and
        # formats/gguf are integration-tests/production-loading's own
        # dependencies (its real production Hugging Face bundle -> CUDA
        # E2E test, task 12.3) -- the latter two were a real, separate gap
        # this workflow had (found dispatching it for
        # add-multi-device-cpu-cuda-execution-proof: "failed to read
        # formats/gguf/Cargo.toml" on the very next step after this one,
        # unrelated to that change's own content), fixed here alongside.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init -- providers/cuda providers/cpu loaders/huggingface formats/safetensors loaders/gguf formats/gguf
      - name: Verify GPU is visible
        run: |
          set -eux
          nvidia-smi
          command -v nvcc
          nvcc --version
          test -d "${CUDA_HOME:-/usr/local/cuda}"
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build and test the CUDA Provider
        # `--include-ignored`: also runs
        # `hardware_conformance_actually_ran_not_silently_skipped`, the one
        # test in this suite that is not allowed to silently pass by
        # early-returning when no GPU is found -- this job's whole purpose
        # is a run where that must never happen (`docs/audits/cuda-provider-full-audit-2026-09-05.md`'s
        # P1 "explicit provider-hardware-cuda == Passed signal" finding).
        run: cargo test --locked --manifest-path providers/cuda/Cargo.toml -- --include-ignored
      - name: CUDA decode matmul bandwidth (diagnostic)
        # The Device time of each decode-step projection shape per matmul
        # Kernel; diagnostic only.
        timeout-minutes: 10
        run: cargo test --locked --release --manifest-path providers/cuda/Cargo.toml decode_matmul_bandwidth -- --ignored --nocapture
      - name: CUDA long-context kernel times (diagnostic)
        # The Device time of each prefill matmul shape and of the attention
        # at 512 and 4096 rows; diagnostic only.
        timeout-minutes: 15
        run: cargo test --locked --release --manifest-path providers/cuda/Cargo.toml long_context_kernel_times -- --ignored --nocapture
      - name: Build and test the real first-native Qwen Component against a real CudaProvider
        # #58: `integration-tests/cuda-first-native` runs the real
        # first-native pipeline (magnetar-runtime, driven by the checked-in
        # compiled qwen-real.component.wasm Component) against a real
        # CudaProvider end to end -- something neither crate can prove
        # importing the other, per that crate's own Cargo.toml comment.
        # Previously in no workflow at all (not merely GPU-gated): the
        # `submodule-integration` job in quality.yml exercises its graceful
        # `!provider.is_available()` early-return path on every PR; this is
        # the one place its real-hardware path actually runs.
        run: cargo test --locked --manifest-path integration-tests/cuda-first-native/Cargo.toml
      - name: Build and test real multi-Device execution (Reference CPU + real CUDA, one Runtime)
        # add-multi-device-cpu-cuda-execution-proof: the first real proof a
        # single Runtime can register two heterogeneous real Providers
        # simultaneously and dispatch one logical computation across both
        # real Devices -- gracefully skips (this test's own tolerance, not
        # a workflow concern) if no compatible CUDA device is found, so
        # this step's real value is specifically a real run against this
        # runner's real GPU, not just a compile check.
        run: cargo test --locked --manifest-path integration-tests/multi-device-cpu-cuda/Cargo.toml
      - name: Build and test real production Qwen loading on CUDA
        # implement-production-qwen-model-loading task 12.3/12.7: the same
        # real ingested Hugging Face bundle, real tokenizer, and real
        # compiled Qwen Component the Reference CPU test proves, instead
        # dispatched through a real CudaProvider. `--include-ignored` also
        # runs this crate's own `hardware_conformance_actually_ran_not_
        # silently_skipped`, mirroring providers/cuda's -- a GPU CI job
        # must not be able to report success while the CUDA-gated test
        # above silently skipped. Filtered to this module: `tests_real_
        # checkpoint_smoke`'s tests need a downloaded checkpoint (next
        # step) and would otherwise panic here for a missing env var.
        run: cargo test --locked --manifest-path integration-tests/production-loading/Cargo.toml tests_production_loading -- --include-ignored
      - name: Download the pinned real Qwen2.5-0.5B-Instruct checkpoint
        # implement-production-qwen-model-loading task 12.4/12.5: pinned by
        # exact revision; `tests_real_checkpoint_smoke.rs` independently
        # verifies model.safetensors' real sha256 against the digest that
        # revision declares before trusting it at all. #61: the other four
        # files were previously fetched by revision with no digest check at
        # all, so a Hugging Face-side change to any of them (the repository
        # allows non-LFS files to be edited without a new revision tag)
        # would silently change what this job tests. Pinned here the same
        # way, against the sha256 each file actually had when these digests
        # were recorded (`sha256sum <file>` against a real download of this
        # exact revision).
        env:
          REVISION: 7ae557604adf67be50417f59c2c2f167def9a775
          CONFIG_JSON_SHA256: 18e18afcaccafade98daf13a54092927904649e1dd4eba8299ab717d5d94ff45
          GENERATION_CONFIG_JSON_SHA256: e558847a8b4402616f1273797b015104dc266fe4b520056fca88823ba8f8ebe6
          TOKENIZER_JSON_SHA256: c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539
          TOKENIZER_CONFIG_JSON_SHA256: 5b5d4f65d0acd3b2d56a35b56d374a36cbc1c8fa5cf3b3febbbfabf22f359583
        run: |
          set -eux
          dir="$RUNNER_TEMP/qwen2.5-0.5b-instruct-$REVISION"
          mkdir -p "$dir"
          for file in config.json generation_config.json tokenizer.json tokenizer_config.json model.safetensors; do
            curl -fsSL "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/$REVISION/$file" -o "$dir/$file"
          done
          verify() {
            local file="$1" expected="$2"
            local actual
            actual="$(sha256sum "$dir/$file" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file sha256 mismatch: expected $expected, got $actual"
              exit 1
            fi
          }
          verify config.json "$CONFIG_JSON_SHA256"
          verify generation_config.json "$GENERATION_CONFIG_JSON_SHA256"
          verify tokenizer.json "$TOKENIZER_JSON_SHA256"
          verify tokenizer_config.json "$TOKENIZER_CONFIG_JSON_SHA256"
          echo "MAGNETAR_QWEN_REAL_CHECKPOINT_DIR=$dir" >> "$GITHUB_ENV"
      - name: Test the real public checkpoint on Reference CPU and real CUDA
        # task 12.4: full production pipeline (real config.json/tokenizer.
        # json/Safetensors -> real compiled Qwen Component -> real
        # Reference CPU dispatch) against a real, publicly downloaded
        # checkpoint, not only tiny synthetic bundles. task 12.5: the same
        # checkpoint's greedy prefill token/text compared between
        # Reference CPU and this same real CUDA hardware.
        run: cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_public_checkpoint -- --include-ignored --test-threads=1
      - name: Real-checkpoint CUDA logits against the Reference CPU corpus
        # qualify-real-checkpoint-performance A02: CUDA's per-step logits
        # and greedy tokens for the pinned checkpoint are compared with the
        # checked-in Reference CPU corpus
        # (integration-tests/production-loading/fixtures/qualification/)
        # under the declared F32 profile, followed by streaming,
        # cancellation and resume checks on the same CUDA instance. A
        # failed comparison writes its full per-step differential evidence
        # to the report directory uploaded below.
        timeout-minutes: 60
        env:
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports"
          cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_logits_match_the_reference_corpus -- --include-ignored --test-threads=1 --nocapture
      - name: Real-checkpoint CUDA decode cost profile (diagnostic)
        # qualify-real-checkpoint-performance: where a CUDA decode step's
        # cost goes -- one warmed-up 64-token request, inter-token latency
        # by position bucket and its growth per token, the share of time
        # inside the Runtime's own prefill/decode steps, and Runtime events
        # per token. Diagnostic only; it gates nothing but must finish.
        timeout-minutes: 30
        env:
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_PROFILE_TOKENS: "64"
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports"
          set -eux
          export MAGNETAR_QUALIFICATION_SUMMARY_PATH="$GITHUB_STEP_SUMMARY"
          cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_decode_cost_profile -- --include-ignored --test-threads=1 --nocapture
      - name: Real-checkpoint CUDA decode cost profile, per node (diagnostic)
        # capture-and-replay-cuda-graphs' disable control: the same profile
        # with decode-step replay off, every step dispatched per node.
        timeout-minutes: 30
        env:
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_PROFILE_TOKENS: "64"
          MAGNETAR_QUALIFICATION_STEP_REPLAY: "0"
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports"
          set -eux
          export MAGNETAR_QUALIFICATION_SUMMARY_PATH="$GITHUB_STEP_SUMMARY"
          cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_decode_cost_profile -- --include-ignored --test-threads=1 --nocapture
      - name: Real-checkpoint qualification campaign on CUDA (cost per token)
        # qualify-real-checkpoint-performance A01/A04: one load, one cold
        # request, one warmup and five measured greedy requests of 128 new
        # tokens on the same resident CUDA instance, recording TTFT, TPOT,
        # inter-token latency (and its growth per token), throughput and
        # resource usage into an immutable, manifest-digest-named JSON
        # report. Back to 128 tokens once per-step cost became flat and
        # ~135 ms on an RTX 3060 (run 41088755268); every finished request
        # is also appended to progress-cuda.jsonl so a timeout still
        # leaves evidence. Reference CPU is deliberately not
        # selected here (tens of seconds per token at this model size);
        # `MAGNETAR_QUALIFICATION_REQUIRE_CUDA=1` makes a missing Device
        # fail the job instead of skipping the campaign.
        timeout-minutes: 60
        env:
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          # Besides the short prompt, one campaign per long context: what a
          # cost that grows with context length looks like.
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
          MAGNETAR_QUALIFICATION_CODE_REVISION: ${{ github.sha }}
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports"
          set -eux
          export MAGNETAR_QUALIFICATION_DRIVER="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | head -n1)"
          export MAGNETAR_QUALIFICATION_SUMMARY_PATH="$GITHUB_STEP_SUMMARY"
          cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture
      - name: Real-checkpoint long-context campaign with Tensor Cores off (disable control)
        # The same 512- and 4096-token campaigns on the bit-identical
        # CUDA-core matmuls: their generated tokens and timings are the
        # comparison for the Tensor Core prefill matmuls.
        timeout-minutes: 30
        env:
          MAGNETAR_CUDA_TENSOR_CORES: "0"
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
        run: cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture
      - name: Download the pinned real Qwen2.5-1.5B-Instruct checkpoint
        # qualify-additional-model-and-state-families F01: a further real
        # checkpoint, pinned by exact revision; the JSON files by the sha256
        # each had at that revision, model.safetensors by its LFS sha256,
        # which the tests verify (`RealCheckpointProfile` qwen2.5-1.5b-instruct).
        env:
          REVISION: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
          CONFIG_JSON_SHA256: 98d2ff8cc47488d08a2b0b3acf4eb99ef210779b42bd48605f6b8e36acdbf670
          GENERATION_CONFIG_JSON_SHA256: e558847a8b4402616f1273797b015104dc266fe4b520056fca88823ba8f8ebe6
          TOKENIZER_JSON_SHA256: c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539
          TOKENIZER_CONFIG_JSON_SHA256: 5b5d4f65d0acd3b2d56a35b56d374a36cbc1c8fa5cf3b3febbbfabf22f359583
        run: |
          set -eux
          dir="$RUNNER_TEMP/qwen2.5-1.5b-instruct-$REVISION"
          mkdir -p "$dir"
          for file in config.json generation_config.json tokenizer.json tokenizer_config.json model.safetensors; do
            curl -fsSL "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct/resolve/$REVISION/$file" -o "$dir/$file"
          done
          verify() {
            local file="$1" expected="$2"
            local actual
            actual="$(sha256sum "$dir/$file" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file sha256 mismatch: expected $expected, got $actual"
              exit 1
            fi
          }
          verify config.json "$CONFIG_JSON_SHA256"
          verify generation_config.json "$GENERATION_CONFIG_JSON_SHA256"
          verify tokenizer.json "$TOKENIZER_JSON_SHA256"
          verify tokenizer_config.json "$TOKENIZER_CONFIG_JSON_SHA256"
          echo "MAGNETAR_QWEN2_5_1_5B_INSTRUCT_DIR=$dir" >> "$GITHUB_ENV"
      - name: Qwen2.5-1.5B-Instruct long-context campaign on CUDA
        # Its Reference CPU comparison is left out: this checkpoint in f32
        # (about 6 GB) does not fit the runner's memory next to the test.
        # The same campaign with the Tensor Cores off is the control: both
        # must generate the same tokens (checked below).
        timeout-minutes: 30
        env:
          MAGNETAR_REAL_CHECKPOINT_PROFILE: qwen2.5-1.5b-instruct
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
          MAGNETAR_QUALIFICATION_CODE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports/qwen2.5-1.5b-instruct-tensor-cores"
          set -o pipefail
          mkdir -p "$MAGNETAR_QUALIFICATION_REPORT_DIR"
          export MAGNETAR_QUALIFICATION_DRIVER="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | head -n1)"
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$MAGNETAR_QWEN2_5_1_5B_INSTRUCT_DIR" \
            cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$MAGNETAR_QUALIFICATION_REPORT_DIR/campaign.log"
      - name: Qwen2.5-1.5B-Instruct long-context campaign with Tensor Cores off (disable control)
        timeout-minutes: 30
        env:
          MAGNETAR_CUDA_TENSOR_CORES: "0"
          MAGNETAR_REAL_CHECKPOINT_PROFILE: qwen2.5-1.5b-instruct
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
          MAGNETAR_QUALIFICATION_CODE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports/qwen2.5-1.5b-instruct-no-tensor-cores"
          set -o pipefail
          mkdir -p "$MAGNETAR_QUALIFICATION_REPORT_DIR"
          export MAGNETAR_QUALIFICATION_DRIVER="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | head -n1)"
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$MAGNETAR_QWEN2_5_1_5B_INSTRUCT_DIR" \
            cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$MAGNETAR_QUALIFICATION_REPORT_DIR/campaign.log"
      - name: Qwen2.5-1.5B-Instruct generates the same tokens with the Tensor Cores on and off
        shell: bash
        run: |
          set -eu
          on="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/qwen2.5-1.5b-instruct-tensor-cores/campaign.log")"
          off="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/qwen2.5-1.5b-instruct-no-tensor-cores/campaign.log")"
          test -n "$on"
          if [ "$on" != "$off" ]; then
            echo "::error::Qwen2.5-1.5B-Instruct: tokens differ with the Tensor Cores on and off"
            diff <(echo "$on") <(echo "$off") || true
            exit 1
          fi
          echo "$on"
      - name: Download the pinned real DeepSeek-R1-Distill-Qwen-1.5B checkpoint
        # qualify-additional-model-and-state-families F01: a further real
        # checkpoint, pinned by exact revision; the JSON files by the sha256
        # each had at that revision, model.safetensors by its LFS sha256,
        # which the tests verify (`RealCheckpointProfile` deepseek-r1-distill-qwen-1.5b).
        env:
          REVISION: ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562
          CONFIG_JSON_SHA256: 37bd455e9679d2959536270fed49d25cc7c290a64f6e52abb97c71345a9cee41
          GENERATION_CONFIG_JSON_SHA256: 72cbec1015da9ed03ad025483005cbf6481403abf947adfd54e504d1a66a2126
          TOKENIZER_JSON_SHA256: 88145e3c3249adc2546ede277e9819d6e405e19072456e4b521cbc724bd60773
          TOKENIZER_CONFIG_JSON_SHA256: 8ac8c85fb242563c2260baec0909debd69d718af6a0b3d90e6cab62b4d341cd5
        run: |
          set -eux
          dir="$RUNNER_TEMP/deepseek-r1-distill-qwen-1.5b-$REVISION"
          mkdir -p "$dir"
          for file in config.json generation_config.json tokenizer.json tokenizer_config.json model.safetensors; do
            curl -fsSL "https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B/resolve/$REVISION/$file" -o "$dir/$file"
          done
          verify() {
            local file="$1" expected="$2"
            local actual
            actual="$(sha256sum "$dir/$file" | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file sha256 mismatch: expected $expected, got $actual"
              exit 1
            fi
          }
          verify config.json "$CONFIG_JSON_SHA256"
          verify generation_config.json "$GENERATION_CONFIG_JSON_SHA256"
          verify tokenizer.json "$TOKENIZER_JSON_SHA256"
          verify tokenizer_config.json "$TOKENIZER_CONFIG_JSON_SHA256"
          echo "MAGNETAR_DEEPSEEK_R1_DISTILL_QWEN_1_5B_DIR=$dir" >> "$GITHUB_ENV"
      - name: DeepSeek-R1-Distill-Qwen-1.5B long-context campaign on CUDA
        # Its Reference CPU comparison is left out: this checkpoint in f32
        # (about 6 GB) does not fit the runner's memory next to the test.
        # The same campaign with the Tensor Cores off is the control: both
        # must generate the same tokens (checked below).
        timeout-minutes: 30
        env:
          MAGNETAR_REAL_CHECKPOINT_PROFILE: deepseek-r1-distill-qwen-1.5b
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
          MAGNETAR_QUALIFICATION_CODE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports/deepseek-r1-distill-qwen-1.5b-tensor-cores"
          set -o pipefail
          mkdir -p "$MAGNETAR_QUALIFICATION_REPORT_DIR"
          export MAGNETAR_QUALIFICATION_DRIVER="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | head -n1)"
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$MAGNETAR_DEEPSEEK_R1_DISTILL_QWEN_1_5B_DIR" \
            cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$MAGNETAR_QUALIFICATION_REPORT_DIR/campaign.log"
      - name: DeepSeek-R1-Distill-Qwen-1.5B long-context campaign with Tensor Cores off (disable control)
        timeout-minutes: 30
        env:
          MAGNETAR_CUDA_TENSOR_CORES: "0"
          MAGNETAR_REAL_CHECKPOINT_PROFILE: deepseek-r1-distill-qwen-1.5b
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
          MAGNETAR_QUALIFICATION_CODE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports/deepseek-r1-distill-qwen-1.5b-no-tensor-cores"
          set -o pipefail
          mkdir -p "$MAGNETAR_QUALIFICATION_REPORT_DIR"
          export MAGNETAR_QUALIFICATION_DRIVER="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | head -n1)"
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$MAGNETAR_DEEPSEEK_R1_DISTILL_QWEN_1_5B_DIR" \
            cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$MAGNETAR_QUALIFICATION_REPORT_DIR/campaign.log"
      - name: DeepSeek-R1-Distill-Qwen-1.5B generates the same tokens with the Tensor Cores on and off
        shell: bash
        run: |
          set -eu
          on="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/deepseek-r1-distill-qwen-1.5b-tensor-cores/campaign.log")"
          off="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/deepseek-r1-distill-qwen-1.5b-no-tensor-cores/campaign.log")"
          test -n "$on"
          if [ "$on" != "$off" ]; then
            echo "::error::DeepSeek-R1-Distill-Qwen-1.5B: tokens differ with the Tensor Cores on and off"
            diff <(echo "$on") <(echo "$off") || true
            exit 1
          fi
          echo "$on"
      - name: Download the pinned real Llama-3.2-1B-Instruct checkpoint
        # qualify-additional-model-and-state-families F01: the first
        # non-Qwen2 checkpoint, served by the Llama Model Component
        # (selected by its manifest's architecture family). Gated: the
        # download authenticates with the HF_TOKEN secret. model.safetensors
        # is pinned by its LFS sha256, which the tests verify
        # (`RealCheckpointProfile` llama-3.2-1b-instruct); the JSON files,
        # which have no LFS digest, by the git blob id each had at that
        # revision.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REVISION: 9213176726f574b556790deb65791e0c5aa438b6
          CONFIG_JSON_BLOB: 3e3aaf51a035cb5092d9f6827a0dc074657ba88c
          GENERATION_CONFIG_JSON_BLOB: 75ae08310d6d23df373ee2644b497192b3cce6d8
          TOKENIZER_JSON_BLOB: 5cc5f00a5b203e90a27a3bd60d1ec393b07971e8
          TOKENIZER_CONFIG_JSON_BLOB: 4ff488a165e900e5129cda7c20ab32d568d2a475
        shell: bash
        run: |
          set -eu
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::the HF_TOKEN secret is required to download the gated Llama 3.2 checkpoint"
            exit 1
          fi
          dir="$RUNNER_TEMP/llama-3.2-1b-instruct-$REVISION"
          mkdir -p "$dir"
          for file in config.json generation_config.json tokenizer.json tokenizer_config.json model.safetensors; do
            curl -fsSL -H "Authorization: Bearer $HF_TOKEN" \
              "https://huggingface.co/meta-llama/Llama-3.2-1B-Instruct/resolve/$REVISION/$file" -o "$dir/$file"
          done
          verify() {
            local file="$1" expected="$2"
            local actual
            actual="$(git hash-object "$dir/$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::$file git blob id mismatch: expected $expected, got $actual"
              exit 1
            fi
          }
          verify config.json "$CONFIG_JSON_BLOB"
          verify generation_config.json "$GENERATION_CONFIG_JSON_BLOB"
          verify tokenizer.json "$TOKENIZER_JSON_BLOB"
          verify tokenizer_config.json "$TOKENIZER_CONFIG_JSON_BLOB"
          echo "MAGNETAR_LLAMA_3_2_1B_INSTRUCT_DIR=$dir" >> "$GITHUB_ENV"
      - name: Llama-3.2-1B-Instruct long-context campaign on CUDA
        # Its Reference CPU comparison is left out: this checkpoint in f32
        # (about 5 GB) does not fit the runner's memory next to the test.
        # The same campaign with the Tensor Cores off is the control: both
        # must generate the same tokens (checked below).
        timeout-minutes: 30
        env:
          MAGNETAR_REAL_CHECKPOINT_PROFILE: llama-3.2-1b-instruct
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
          MAGNETAR_QUALIFICATION_CODE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports/llama-3.2-1b-instruct-tensor-cores"
          set -o pipefail
          mkdir -p "$MAGNETAR_QUALIFICATION_REPORT_DIR"
          export MAGNETAR_QUALIFICATION_DRIVER="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | head -n1)"
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$MAGNETAR_LLAMA_3_2_1B_INSTRUCT_DIR" \
            cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$MAGNETAR_QUALIFICATION_REPORT_DIR/campaign.log"
      - name: Llama-3.2-1B-Instruct long-context campaign with Tensor Cores off (disable control)
        timeout-minutes: 30
        env:
          MAGNETAR_CUDA_TENSOR_CORES: "0"
          MAGNETAR_REAL_CHECKPOINT_PROFILE: llama-3.2-1b-instruct
          MAGNETAR_QUALIFICATION_PROVIDERS: cuda
          MAGNETAR_QUALIFICATION_REQUIRE_CUDA: "1"
          MAGNETAR_QUALIFICATION_MAX_NEW_TOKENS: "128"
          MAGNETAR_QUALIFICATION_MEASURED_RUNS: "5"
          MAGNETAR_QUALIFICATION_CONTEXT_TOKENS: "512,4096"
          MAGNETAR_QUALIFICATION_CODE_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          export MAGNETAR_QUALIFICATION_REPORT_DIR="$RUNNER_TEMP/qualification-reports/llama-3.2-1b-instruct-no-tensor-cores"
          set -o pipefail
          mkdir -p "$MAGNETAR_QUALIFICATION_REPORT_DIR"
          export MAGNETAR_QUALIFICATION_DRIVER="$(nvidia-smi --query-gpu=name,driver_version --format=csv,noheader | head -n1)"
          MAGNETAR_QWEN_REAL_CHECKPOINT_DIR="$MAGNETAR_LLAMA_3_2_1B_INSTRUCT_DIR" \
            cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_checkpoint_qualification_campaign -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$MAGNETAR_QUALIFICATION_REPORT_DIR/campaign.log"
      - name: Llama-3.2-1B-Instruct generates the same tokens with the Tensor Cores on and off
        shell: bash
        run: |
          set -eu
          on="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/llama-3.2-1b-instruct-tensor-cores/campaign.log")"
          off="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/llama-3.2-1b-instruct-no-tensor-cores/campaign.log")"
          test -n "$on"
          if [ "$on" != "$off" ]; then
            echo "::error::Llama-3.2-1B-Instruct: tokens differ with the Tensor Cores on and off"
            diff <(echo "$on") <(echo "$off") || true
            exit 1
          fi
          echo "$on"
          grep 'generated text' "$RUNNER_TEMP/qualification-reports/llama-3.2-1b-instruct-tensor-cores/campaign.log" || true
      - name: Download the pinned real Qwen2.5-0.5B-Instruct Q8_0 GGUF checkpoint
        # execute-direct-quantized-weights (B03): a genuinely Q8_0-quantized
        # export, pinned by its sha256, which the test verifies.
        env:
          REVISION: 9217f5db79a29953eb74d5343926648285ec7e67
        shell: bash
        run: |
          set -eu
          dir="$RUNNER_TEMP/qwen2.5-0.5b-instruct-q8_0-gguf-$REVISION"
          mkdir -p "$dir"
          curl -fsSL "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/$REVISION/qwen2.5-0.5b-instruct-q8_0.gguf" -o "$dir/model.gguf"
          echo "MAGNETAR_QWEN_GGUF_Q8_0_REAL_CHECKPOINT_DIR=$dir" >> "$GITHUB_ENV"
      - name: Q8_0 GGUF on CUDA with packed weights
        # The quantized matrices are stored packed and the decode matmul
        # reads them packed.
        timeout-minutes: 20
        env:
          MAGNETAR_REQUIRE_CUDA: "1"
          # Diagnostic: attribute any Device error to the call that caused it.
          CUDA_LAUNCH_BLOCKING: "1"
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/qualification-reports/q8_0-gguf"
          cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_public_q8_0_gguf_checkpoint_generates_on_cuda -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/qualification-reports/q8_0-gguf/packed.log"
      - name: Q8_0 GGUF on CUDA with packed weights declined (disable control)
        # MAGNETAR_CUDA_PACKED_WEIGHTS=0: Model Loading dequantizes the same
        # weights to f32 at load, as before direct quantized execution.
        timeout-minutes: 20
        env:
          MAGNETAR_REQUIRE_CUDA: "1"
          MAGNETAR_CUDA_PACKED_WEIGHTS: "0"
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --release --manifest-path integration-tests/production-loading/Cargo.toml real_public_q8_0_gguf_checkpoint_generates_on_cuda -- --include-ignored --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/qualification-reports/q8_0-gguf/dequantized.log"
      - name: Q8_0 GGUF generates the same tokens packed and dequantized
        shell: bash
        run: |
          set -eu
          packed="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/q8_0-gguf/packed.log")"
          dequantized="$(grep 'generated token ids' "$RUNNER_TEMP/qualification-reports/q8_0-gguf/dequantized.log")"
          test -n "$packed"
          grep -h 'packed weights\|generated text' "$RUNNER_TEMP"/qualification-reports/q8_0-gguf/*.log
          if [ "$packed" != "$dequantized" ]; then
            echo "::error::Q8_0 GGUF: tokens differ between packed and dequantized weights"
            diff <(echo "$packed") <(echo "$dequantized") || true
            exit 1
          fi
          echo "$packed"
      - name: Upload qualification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: qualification-reports-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification-reports
          if-no-files-found: warn
          retention-days: 90
