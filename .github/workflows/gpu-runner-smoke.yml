name: GPU Runner Smoke Test

# Confirms the arc-gpu-magnetar self-hosted GPU runner is reachable and can
# build/test providers/cuda's real CUDA Provider: device discovery, the
# `operator-scope` required-now kernel set (NVRTC-compiled), the
# device-resident allocation table and explicit host/device data movement
# (`enable-device-resident-kernel-chaining`), and the `provider-core`/
# `provider-compute`/`provider-data-movement` conformance profiles against
# real hardware. Manual only: not gated per-PR because it needs a live GPU
# runner, not because there is nothing CUDA-specific to test.
on:
  workflow_dispatch:

concurrency:
  group: gpu-runner-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: gpu / smoke test
    runs-on: arc-gpu-magnetar
    container:
      image: nvidia/cuda:13.3.1-cudnn-devel-ubuntu24.04
      options: --gpus all
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Install build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git curl build-essential ca-certificates
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout CUDA Provider submodule
        # The container's git refuses to touch a workspace it doesn't own --
        # the checkout step ran before git existed in this image, so the
        # workspace's ownership doesn't match this step's user. Also checks
        # out providers/cpu: providers/cuda's [dev-dependencies] path-depends
        # on it (conformance tests compare CUDA kernel output against
        # Reference CPU's), so cargo cannot even load the manifest without it
        # -- a real gap this workflow had (confirmed by dispatching it: it
        # failed with "failed to read providers/cpu/Cargo.toml" before this
        # fix), not something introduced by CUDA-specific test content.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init -- providers/cuda providers/cpu
      - name: Verify GPU is visible
        run: |
          set -eux
          nvidia-smi
          command -v nvcc
          nvcc --version
          test -d "${CUDA_HOME:-/usr/local/cuda}"
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build and test the CUDA Provider
        run: cargo test --locked --manifest-path providers/cuda/Cargo.toml
