name: Benchmark GPU

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model profile (Qwen3.6 needs about 32 GB RAM and 30 GB free disk)
        type: choice
        options: [qwen2.5-0.5b, qwen3.6-35b-experimental]
        default: qwen2.5-0.5b
        required: true
      tokens:
        description: Maximum generated tokens per request (at least 2)
        default: '16'
        required: true
      runs:
        description: Number of measured requests per engine
        default: '5'
        required: true

permissions:
  contents: read

concurrency:
  group: gpu-runner-smoke
  cancel-in-progress: false

jobs:
  benchmark:
    name: GPU / same-machine comparison
    runs-on: arc-gpu-magnetar
    timeout-minutes: 360
    container:
      image: nvidia/cuda:13.5.0-cudnn-devel-ubuntu24.04
      options: --gpus all
    defaults:
      run:
        shell: bash
    env:
      BENCH_DEVICE: gpu
      BENCH_MODEL_PROFILE: ${{ inputs.model }}
      BENCH_TOKENS: ${{ inputs.tokens }}
      BENCH_RUNS: ${{ inputs.runs }}
    steps:
      - name: Install benchmark dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git curl build-essential ca-certificates cmake pkg-config libssl-dev python3 python3-venv zstd
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Select pinned Rust toolchain
        run: rustup show
      - name: Initialize Magnetar dependencies
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init -- providers/cuda providers/cpu loaders/huggingface formats/safetensors loaders/gguf formats/gguf
      - name: Record GPU and run all engines sequentially
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          nvidia-smi | tee "$RUNNER_TEMP/benchmark-results/gpu-info.txt"
          nvcc --version | tee "$RUNNER_TEMP/benchmark-results/cuda-version.txt"
          bash benchmark/campaign.sh
      - name: Upload benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
