name: Benchmark GPU

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to benchmark
        type: choice
        options: [magnetar, candle, llama_cpp, ollama, strata]
        default: magnetar
        required: true
      tokens:
        description: Maximum number of generated tokens
        default: '16'
        required: true
      runs:
        description: Number of measured requests
        default: '5'
        required: true
      engine_ref:
        description: 'Optional Candle/llama.cpp Git ref or server version'
        required: false
      server_url:
        description: 'Base URL of the running Ollama or Strata server'
        required: false
      server_model:
        description: Model name on the running server
        required: false

permissions:
  contents: read

# The GPU smoke workflow uses the same hardware and concurrency group.
concurrency:
  group: gpu-runner-smoke
  cancel-in-progress: false

jobs:
  benchmark:
    name: GPU / ${{ inputs.engine }}
    runs-on: arc-gpu-magnetar
    timeout-minutes: 360
    container:
      image: nvidia/cuda:13.5.0-cudnn-devel-ubuntu24.04
      options: --gpus all
    defaults:
      run:
        shell: bash
    env:
      BENCH_ENGINE: ${{ inputs.engine }}
      BENCH_DEVICE: gpu
      BENCH_TOKENS: ${{ inputs.tokens }}
      BENCH_RUNS: ${{ inputs.runs }}
      BENCH_ENGINE_REF: ${{ inputs.engine_ref }}
      BENCH_URL: ${{ inputs.server_url }}
      BENCH_MODEL: ${{ inputs.server_model }}
      STRATA_API_KEY: ${{ secrets.STRATA_API_KEY }}
    steps:
      - name: Install benchmark build dependencies
        run: apt-get update && apt-get install -y --no-install-recommends git curl build-essential ca-certificates cmake pkg-config libssl-dev python3
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Select pinned Rust toolchain
        run: rustup show
      - name: Initialize Magnetar dependencies
        if: ${{ inputs.engine == 'magnetar' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init -- providers/cuda providers/cpu loaders/huggingface formats/safetensors loaders/gguf formats/gguf
      - name: Verify GPU and run benchmark
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/benchmark-results"
          nvidia-smi | tee "$RUNNER_TEMP/benchmark-results/gpu-info.txt"
          nvcc --version | tee "$RUNNER_TEMP/benchmark-results/cuda-version.txt"
          bash benchmark/ci.sh
      - name: Upload benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
