name: Create Release Tag

# Creates and pushes a lightweight git tag using this workflow's own
# GITHUB_TOKEN (via the permissions: contents: write grant below) --
# the same mechanism release-publication.yml's github-release job
# already relies on to create releases. Exists because pushing a tag
# ref from outside GitHub's own infrastructure (e.g. a sandboxed CI
# agent's git proxy) can be blocked even when pushing branches is
# allowed; running on an Actions runner sidesteps that without
# widening any credential. `environment: release` mirrors the other
# real, state-changing workflows in this repo, so the repo owner can
# attach required reviewers to that environment if desired.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to create (e.g. v1.0.0-RC1)
        required: true
        type: string
      sha:
        description: Commit SHA to tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    name: create-tag / push
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # MAG-15: this workflow takes an arbitrary tag/sha pair from
      # whoever can dispatch it, and the real-publish pipeline it feeds
      # re-validates its own gates, so this can't become a trust
      # bypass -- but nothing stopped an operator mistake (wrong SHA,
      # malformed tag) from reaching `git push`. Fail closed on both
      # before touching the remote: the tag must look like this repo's
      # own `vMAJOR.MINOR.PATCH[-PRERELEASE]` convention, and the SHA
      # must both exist and be an ancestor of `origin/main` (a real
      # commit this branch's history actually contains, not an
      # unrelated or future one).
      - name: Validate tag and sha
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          sha="${{ inputs.sha }}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::tag '$tag' does not match vMAJOR.MINOR.PATCH[-PRERELEASE]" >&2
            exit 1
          fi
          if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
            echo "::error::sha '$sha' is not a commit this checkout knows about" >&2
            exit 1
          fi
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::sha '$sha' is not an ancestor of origin/main" >&2
            exit 1
          fi
      # GitHub does not run a workflow off an event generated by the
      # default GITHUB_TOKEN (its own loop-prevention rule), so this
      # push does NOT auto-fire release-publication.yml's
      # `push: tags: ["v*"]` trigger. That is expected, not a gap:
      # dispatch release-publication.yml's own `workflow_dispatch`
      # explicitly afterwards against this tag -- it already covers
      # dry-run-publish/gate-evaluation/github-release/real-publish on
      # workflow_dispatch or a tag ref, a superset of what the
      # push-trigger would have run.
      - name: Create and push the tag
        run: |
          set -euo pipefail
          git tag "${{ inputs.tag }}" "${{ inputs.sha }}"
          git push origin "${{ inputs.tag }}"
          echo "Pushed tag ${{ inputs.tag }} -> ${{ inputs.sha }}"
