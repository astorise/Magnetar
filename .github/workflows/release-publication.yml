name: Release Publication

# MAG-06 (openspec/changes/implement-release-publication-automation):
# publishes `magnetar-runtime` to crates.io and creates a GitHub Release
# carrying checksums/SBOM/provenance, gated on
# release_packaging::release_may_publish_stable and
# release_security::evaluate_release_security_blocking both passing
# against the tagged commit's own real CI results.
#
# `dry-run-publish` runs unconditionally, without any credential, on every
# trigger below -- it is the one job this workflow SHOULD keep green with
# no secrets configured. `real-publish` (the actual `cargo publish`) only
# runs on a manual `workflow_dispatch`, per
# "First Real Publication Is Manually Triggered", and fails closed with an
# explicit message if `CARGO_REGISTRY_TOKEN` is not configured, per
# "Credential-Gated Publish Steps Fail Closed".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-publication-${{ github.ref }}
  cancel-in-progress: false

# MAG-12: least privilege -- only `github-release` actually writes
# repository content (creating/updating the GitHub Release). Every other
# job only reads the checkout, check-run conclusions, or builds a binary
# to upload as a workflow artifact; none needs write access at all.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run-publish:
    name: release-publication / dry-run publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: cargo publish --dry-run (no credential required)
        run: cargo publish --locked --dry-run -p magnetar-runtime

  gate-evaluation:
    name: release-publication / gate evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@1409d49f7bb747ddc0b87d15cbb92cc124920b08 # cargo-deny
      # release_packaging::release_may_publish_stable requires every gate
      # in REQUIRED_RELEASE_GATES to be present and passed. We read the
      # ones this repository's quality.yml already runs as named
      # check-runs on the exact commit being released (never re-run them
      # here -- "the tagged commit's actual CI run", not a fresh one),
      # via the GitHub Checks API.
      #
      # Mapping (documented, not guessed at run time -- see
      # docs/release-publication.md for the rationale behind each line):
      #   Formatting                    <- "quality / rustfmt"
      #   CargoCheck                    <- "quality / check (ubuntu-latest)"
      #   Clippy                        <- "quality / clippy"
      #   UnitTests                     <- "quality / test (ubuntu-latest)"
      #   ContractTests                 <- "quality / test (ubuntu-latest)"
      #   OpenSpecValidation            <- "quality / openspec"
      #   WitValidation                 <- "quality / wit"
      #   ReferenceCpuConformance       <- "quality / provider conformance"
      #   OperatorFirstScopeConformance <- "quality / test (ubuntu-latest)"
      #   RuntimeInferenceApiTests      <- "quality / test (ubuntu-latest)"
      #   E2eLocalConformance           <- "quality / e2e conformance"
      #   CoverageGate                  <- "quality / coverage"
      #   RedactionChecks               <- "quality / test (ubuntu-latest)"
      #   NoRawHandleExposureChecks     <- "quality / test (ubuntu-latest)"
      #   CliBoundaryTests              <- "quality / cli boundary"
      #
      # `magnetar-cli` is deliberately excluded from the root `[workspace]`,
      # so `quality / cli boundary` runs its test suite on its own and feeds
      # this gate.
      - name: Fetch check-run conclusions for this commit
        id: check-runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
            --paginate --jq '.check_runs[] | {name, conclusion}' \
            | jq -s '.' > check-runs.json
          cat check-runs.json
      - name: Build release-gate results from check-run conclusions
        run: |
          set -euo pipefail
          jq -n --slurpfile runs check-runs.json '
            def find_run(name): ($runs[0] // []) | map(select(.name == name)) | first;
            def passed(name): (find_run(name).conclusion // "") == "success";
            [
              {gate: "Formatting", passed: passed("quality / rustfmt")},
              {gate: "CargoCheck", passed: passed("quality / check (ubuntu-latest)")},
              {gate: "Clippy", passed: passed("quality / clippy")},
              {gate: "UnitTests", passed: passed("quality / test (ubuntu-latest)")},
              {gate: "ContractTests", passed: passed("quality / test (ubuntu-latest)")},
              {gate: "OpenSpecValidation", passed: passed("quality / openspec")},
              {gate: "WitValidation", passed: passed("quality / wit")},
              {gate: "ReferenceCpuConformance", passed: passed("quality / provider conformance")},
              {gate: "OperatorFirstScopeConformance", passed: passed("quality / test (ubuntu-latest)")},
              {gate: "RuntimeInferenceApiTests", passed: passed("quality / test (ubuntu-latest)")},
              {gate: "E2eLocalConformance", passed: passed("quality / e2e conformance")},
              {gate: "CoverageGate", passed: passed("quality / coverage")},
              {gate: "RedactionChecks", passed: passed("quality / test (ubuntu-latest)")},
              {gate: "NoRawHandleExposureChecks", passed: passed("quality / test (ubuntu-latest)")},
              {gate: "CliBoundaryTests", passed: passed("quality / cli boundary")}
            ]' > release-gate-results.json
          cat release-gate-results.json
      - name: Evaluate release_may_publish_stable
        run: |
          cargo run --locked --manifest-path tools/release-publish/Cargo.toml -- \
            release-gate --results release-gate-results.json
      # cargo-deny's `-f json` output goes to stderr, not stdout -- `|| true`
      # keeps this step from failing on cargo-deny's own exit code so the
      # release-publish security-gate step below gets to make the real
      # pass/fail decision from the parsed inputs.
      - name: Run cargo-deny (JSON, for security-gate parsing)
        run: cargo deny --all-features -f json check 2> cargo-deny.jsonl || true
      # MAG-07: a real scan over the tagged commit's own checked-out
      # source/docs, feeding `secrets_detected` below from an actual
      # result instead of a switch nobody passed. Scoped to the checkout
      # (source, docs, release notes) -- bundle-stage artifacts
      # (conformance/E2E reports, build logs, the packaged release
      # archive) don't exist yet at gate-evaluation time and are not this
      # step's concern.
      - name: Scan for secret-shaped content
        run: |
          cargo run --locked --manifest-path tools/release-publish/Cargo.toml -- \
            secret-scan . --out secret-scan-result.json
      - name: Evaluate evaluate_release_security_blocking
        run: |
          cargo run --locked --manifest-path tools/release-publish/Cargo.toml -- \
            security-gate --cargo-deny-json cargo-deny.jsonl \
            --release-gate-results release-gate-results.json \
            --secret-scan-result secret-scan-result.json \
            --out security-gate-inputs.json
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-gate-evidence
          path: |
            check-runs.json
            release-gate-results.json
            secret-scan-result.json
            security-gate-inputs.json

  build-cli-binaries:
    name: release-publication / build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [dry-run-publish, gate-evaluation]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # magnetar-cli lives in submodule-workspace (#64), not the root
      # [workspace] -- quality.yml's "cli boundary" job already proves it
      # builds and tests from there on every PR; this just builds it in
      # --release mode for real distribution instead of re-testing it.
      - name: Build magnetar-cli (release)
        run: cargo build --locked --release --manifest-path submodule-workspace/Cargo.toml -p magnetar-cli
      # Named by its real host triple (via `rustc -vV`, not a hardcoded
      # guess at what each runner label happens to mean today) so a
      # consumer can tell exactly what each binary is without guessing,
      # and so a future runner-image change (e.g. macos-latest's
      # architecture) can't silently mislabel the artifact.
      - name: Package binary under its real host target triple
        id: package
        shell: bash
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            ext=".exe"
          fi
          src="submodule-workspace/target/release/magnetar-cli${ext}"
          dest="magnetar-cli-${triple}${ext}"
          cp "$src" "$dest"
          echo "artifact_name=$dest" >> "$GITHUB_OUTPUT"
      - name: Upload CLI binary as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-binary-${{ matrix.os }}
          path: ${{ steps.package.outputs.artifact_name }}

  github-release:
    name: release-publication / GitHub Release
    runs-on: ubuntu-latest
    needs: [dry-run-publish, gate-evaluation, build-cli-binaries]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build release bundle directory
        run: |
          set -euo pipefail
          mkdir -p release-bundle
          git archive --format=tar.gz --prefix="magnetar-${{ github.ref_name }}/" \
            -o "release-bundle/magnetar-${{ github.ref_name }}-source.tar.gz" HEAD
      # MAG-12: real multi-platform magnetar-cli binaries, built by
      # build-cli-binaries above, downloaded directly into the bundle so
      # checksum-bundle (next step) covers them too -- one checksum
      # manifest for everything actually published, not just the source
      # archive.
      - name: Download CLI binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: cli-binary-*
          path: release-bundle
          merge-multiple: true
      # MAG-12: the real release-gate/security-gate evidence gate-
      # evaluation already generated against this exact tagged commit --
      # attached to the release itself, not only a workflow artifact that
      # expires, so a consumer can see the actual conformance/security
      # verdicts a release was cut under.
      - name: Download release gate evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-gate-evidence
          path: release-bundle
      - name: Generate checksums
        run: |
          cargo run --locked --manifest-path tools/release-publish/Cargo.toml -- \
            checksum-bundle release-bundle --out checksums.json
      - name: Verify checksums against the bundle we are about to publish
        run: |
          cargo run --locked --manifest-path tools/release-publish/Cargo.toml -- \
            verify-checksums checksums.json release-bundle
      - name: Generate SBOM
        run: |
          cargo metadata --locked --format-version=1 --no-deps \
            --manifest-path roadmap-contracts/Cargo.toml > cargo-metadata.json
          cargo run --locked --manifest-path tools/release-publish/Cargo.toml -- \
            sbom --cargo-metadata cargo-metadata.json --out sbom.json \
            --build-target x86_64-unknown-linux-gnu
      - name: Generate provenance
        run: |
          cargo run --locked --manifest-path tools/release-publish/Cargo.toml -- \
            provenance --repo . --out provenance.json \
            --release-tag "${{ github.ref_name }}" \
            --ci-run-id "${{ github.run_id }}" \
            --openspec-dir openspec/specs \
            --wit-dir magnetar-runtime/wit
      # MAG-12: a release candidate SHALL never be presented as stable
      # (ReleaseCandidateTag::is_stable() is false for every value) --
      # mirrored here as a tag-shape check, since gh release create has
      # no access to that Rust type. Matches both this policy's own
      # `-alpha`/`-beta`/`-rc.N` convention and the real `-RC<n>` form
      # the v1.0.0-RC0 tag actually used, case-insensitively.
      - name: Determine prerelease status from the tag
        id: prerelease
        run: |
          set -euo pipefail
          tag_lower="$(tr '[:upper:]' '[:lower:]' <<< "${{ github.ref_name }}")"
          if [[ "$tag_lower" =~ -(alpha|beta|rc)[.0-9]*$ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      # Idempotent on purpose: this job also runs on a manual
      # `workflow_dispatch` against an already-tagged commit (e.g. to run
      # `real-publish`, which only fires on `workflow_dispatch`), so a
      # release for this tag may already exist from the original tag-push
      # run. `gh release create` fails outright in that case; re-running
      # must instead refresh the release's assets with the bundle/proofs
      # generated from *this* run so they stay keyed to the actually
      # published bytes, never leaving the workflow red for a reason
      # unrelated to publication succeeding.
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.prerelease.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              release-bundle/* checksums.json sbom.json provenance.json \
              --clobber
            gh release edit "${{ github.ref_name }}" --prerelease="$IS_PRERELEASE"
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --prerelease="$IS_PRERELEASE" \
              release-bundle/* checksums.json sbom.json provenance.json
          fi

  real-publish:
    name: release-publication / cargo publish (real)
    runs-on: ubuntu-latest
    needs: [dry-run-publish, gate-evaluation]
    # "First Real Publication Is Manually Triggered": never runs
    # automatically off a tag push, only an explicit workflow_dispatch,
    # until a human has confirmed the pipeline end to end.
    if: github.event_name == 'workflow_dispatch'
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # "Credential-Gated Publish Steps Fail Closed": asserts the secret is
      # present and non-empty and fails with an explicit message before
      # any network call if it is not, rather than skipping silently.
      - name: Check crates.io token is configured
        run: |
          if [ -z "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured as a repository secret. Configure it under Settings > Secrets and variables > Actions before running this workflow manually to publish for real." >&2
            exit 1
          fi
      - name: cargo publish (real)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p magnetar-runtime
