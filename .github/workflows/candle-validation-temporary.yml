name: Candle benchmark validation
on:
  push:
    branches: [codex/candle-benchmark-validation-20261119]
permissions:
  contents: read
jobs:
  candle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BENCH_ENGINE: candle
      BENCH_DEVICE: cpu
      BENCH_TOKENS: '2'
      BENCH_RUNS: '1'
      BENCH_MODEL_PROFILE: qwen2.5-0.5b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config libssl-dev
      - run: rustup show
      - run: python3 -m unittest discover -s benchmark/tests -v
      - run: bash benchmark/ci.sh
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candle-validation
          path: ${{ runner.temp }}/benchmark-results/
          if-no-files-found: warn
