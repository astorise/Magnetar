[workspace]
# Own workspace root, not a member of the repository root's: this crate
# depends on `loaders/huggingface` below, an externalized submodule not
# present in every checkout -- see the root `Cargo.toml`'s comment.

[package]
name = "magnetar-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "First-party client/workspace/agent runtime around Magnetar inference (magnetar-cli inference boundary)."
# Never published: the binary this repository ships, not a library other
# crates depend on. Without this, cargo-deny's wildcard-path-dependency ban
# fired on magnetar-cli's own path dependencies below -- `allow-wildcard-paths`
# (deny.toml) only exempts a crate cargo-deny can see is not publishable,
# since crates.io itself disallows path dependencies in a published crate
# (#59).
publish = false

[dependencies]
magnetar-runtime = { path = "../magnetar-runtime", version = "0.1.0" }
magnetar-loader-huggingface = { path = "../loaders/huggingface" }
# `magnetar release-version`/`magnetar version` (commands.rs) build a
# ReleaseBinaryVersionReport -- release_packaging's own #62 move out of
# magnetar-runtime revealed this as the one real, non-doc-comment
# dependency magnetar-cli had on a roadmap/release-process module.
magnetar-roadmap-contracts = { path = "../roadmap-contracts" }
